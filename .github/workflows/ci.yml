name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    name: Lint commit messages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history so commitlint can resolve the pushed/PR commit range.
          fetch-depth: 0

      - name: Lint commits
        uses: wagoid/commitlint-github-action@v6

  build:
    name: Lint, test & verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      # `check` runs detektMain/detektTest (read-only lint + format gate) and the test suite.
      - name: Lint, format check & test
        run: ./gradlew check

      - name: Verify plugin
        run: ./gradlew verifyPlugin
